version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  detailed:
    format: "%(asctime)s | %(levelname)-8s | %(process)d | %(name)s:%(lineno)d | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout
  file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: detailed
    filename: logs/earthquake_bigdata.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8

loggers:
  earthquake_bigdata:
    level: INFO
    handlers: [console, file]
    propagate: false
  py4j:
    level: WARN
    handlers: [console]
    propagate: false

root:
  level: WARN
  handlers: [console, file]
